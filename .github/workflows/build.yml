name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Chooses between the self-hosted runner and GitHub's cloud runners.
  # The self-hosted machine publishes the SELF_HOSTED_HEARTBEAT repo variable every
  # 2 minutes while its runner is up. If that timestamp is missing or older than
  # 5 minutes (machine off, asleep, or crashed) we fall back to windows-latest so
  # nobody's PR sits in the queue waiting for hardware that isn't there.
  pick-runner:
    runs-on: ubuntu-latest
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
    steps:
      - name: Select runner
        id: pick
        env:
          HEARTBEAT: ${{ vars.SELF_HOSTED_HEARTBEAT }}
          MAX_AGE_SECONDS: "300"
          # Empty on push / workflow_dispatch. A fork's PR never runs on the desktop: the self-hosted
          # runner executes whatever workflow the PR carries.
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          SELF='["self-hosted","windows","x64","fb-windows-app"]'
          CLOUD='"windows-latest"'

          if [ -n "$PR_HEAD_REPO" ] && [ "$PR_HEAD_REPO" != "$THIS_REPO" ]; then
            echo "Pull request from a fork ($PR_HEAD_REPO) -> windows-latest"
            echo "runs_on=$CLOUD" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$HEARTBEAT" ]; then
            echo "No SELF_HOSTED_HEARTBEAT set -> windows-latest"
            echo "runs_on=$CLOUD" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          hb=$(date -u -d "$HEARTBEAT" +%s 2>/dev/null || echo 0)
          if [ "$hb" -eq 0 ]; then
            echo "Unparseable heartbeat '$HEARTBEAT' -> windows-latest"
            echo "runs_on=$CLOUD" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          age=$(( $(date -u +%s) - hb ))
          if [ "$age" -le "$MAX_AGE_SECONDS" ] && [ "$age" -ge -60 ]; then
            echo "Heartbeat is ${age}s old -> self-hosted"
            echo "runs_on=$SELF" >> "$GITHUB_OUTPUT"
          else
            echo "Heartbeat is ${age}s old (stale) -> windows-latest"
            echo "runs_on=$CLOUD" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs_on) }}
    # Keep experimental classification off, including on a runner with local opt-in settings.
    env:
      FOCUSBEAR_NATIVE_RELEVANCE: "0"
      FOCUSBEAR_FEATURE_DIAGNOSTICS: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      # Name the SDK the test step runs on instead of inheriting whatever the image ships.
      # The language version is pinned in the csproj, which is what actually keeps CI and a
      # dev box compiling the same source the same way; this just keeps the runtime explicit.
      # On the self-hosted desktop the runner's account can't write to C:\Program Files\dotnet, so the SDK
      # goes to the runner's tool cache there (kept between runs). Empty on the cloud image: its default.
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ needs.pick-runner.outputs.runs_on != '"windows-latest"' && format('{0}\dotnet', runner.tool_cache) || '' }}
        with:
          dotnet-version: '8.0.x' 

      - name: Restore NuGet packages
        run: nuget restore "Focus Bear.sln"

      - name: Build solution
        run: msbuild "Focus Bear.sln" /p:Configuration=Release /p:Platform="Any CPU" /m /v:minimal

      # Runs even when the build fails so a committed key is still reported; the build output is
      # scanned too, because a key baked in by MSBuild never appears in the source.
      # Windows PowerShell, not pwsh: PowerShell 7 is on the cloud image but not on the self-hosted desktop,
      # and the script needs nothing newer than 5.1.
      - name: Scan source and build output for OpenAI API keys
        if: ${{ !cancelled() }}
        shell: powershell
        run: ./.github/scripts/scan-for-openai-keys.ps1 -ExtraDirectories bin/Release

      # FocusBear.Core is deliberately WPF-free and multi-targeted, so these also run with
      # `dotnet test Core.Tests` on any developer machine, Windows or not. Here they run twice:
      # on net8.0, and on net472 against Core's net472 build — the binary the app ships.
      - name: Run Core tests
        run: dotnet test Core.Tests/FocusBear.Core.Tests.csproj --configuration Release --verbosity minimal

      # The seam between the app and Core: the adapters that read WPF state and hand it to a Core
      # rule. It references the WPF app, which only the MSBuild step above can build, hence
      # --no-build. It also loads the app assembly and Core together on .NET Framework.
      - name: Run app seam tests
        env:
          FOCUSBEAR_ATTACHMENT_CAPTURE_DIRECTORY: ${{ runner.temp }}/attachment-captures
        run: dotnet test App.Tests/FocusBear.App.Tests.csproj --no-build --configuration Release --verbosity minimal

      - name: Upload native attachment capture
        uses: actions/upload-artifact@v4
        with:
          name: native-draft-attachment-capture
          path: ${{ runner.temp }}/attachment-captures/*.png
          if-no-files-found: error

      # The only place the built app is ever actually started before a human installs it. Logged out
      # on a clean image it should reach the login screen and stay up; it must not exit, and it must
      # not hit an unhandled dispatcher exception (the app swallows those after logging them, so an
      # "is it running?" check alone would pass a broken start). GITHUB_ACTIONS is inherited, so the
      # app sends no PostHog events and reports to Sentry under the `ci` environment.
      # On the self-hosted desktop the Release exe would start against the real profile (log, data folder,
      # signed-in account), collide with the Focus Bear already running there (single instance), and register
      # the crash watchdog task. So there the step starts the isolated E2E build instead, as a named instance
      # ("Focus Bear E2E ci-smoke": its own data folder, registry root and mutex, no watchdog or startup tasks),
      # wiped before and after so it always starts logged out. The cloud runner still smoke-tests the Release exe.
      - name: Build the isolated E2E app (self-hosted only)
        if: needs.pick-runner.outputs.runs_on != '"windows-latest"'
        run: msbuild "Focus Bear.csproj" /p:Configuration=Debug /p:FocusBearE2E=true /p:Platform=AnyCPU /m /v:minimal

      - name: Launch smoke test
        shell: powershell
        env:
          SELF_HOSTED: ${{ needs.pick-runner.outputs.runs_on != '"windows-latest"' }}
        run: |
          if ($env:SELF_HOSTED -eq 'true') {
            $env:FOCUSBEAR_E2E_INSTANCE = 'ci-smoke'
            $exe     = Join-Path $PWD 'bin\E2E\Focus Bear.exe'
            $dataDir = Join-Path $env:LOCALAPPDATA 'Focus Bear E2E ci-smoke'
            $regKey  = 'HKCU:\Software\Focus Bear E2E ci-smoke'
            foreach ($p in $dataDir, $regKey) { if (Test-Path $p) { Remove-Item $p -Recurse -Force } }
          } else {
            $exe     = Join-Path $PWD 'bin\Release\Focus Bear.exe'
            $dataDir = Join-Path $env:LOCALAPPDATA 'Focus Bear'
          }
          $log = Join-Path $dataDir 'Logs\Debug_Logs.txt'
          $smokeStart = Get-Date
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 45

          if (Test-Path $log) { Get-Content $log -Tail 80 } else { Write-Host "no log at $log" }
          $failures = @()
          if ($app.HasExited) {
            $failures += "the app exited during startup (code $($app.ExitCode))"
            Write-Host 'Windows Application events since smoke test launch:'
            try {
              $events = @(Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $smokeStart } -ErrorAction Stop |
                Where-Object { $_.ProviderName -in @('.NET Runtime', 'Application Error', 'Windows Error Reporting') -and
                  $_.Message -match 'Focus Bear|Focus_Bear|onnxruntime' })
              if ($events.Count -eq 0) { Write-Host 'No matching application crash events found.' }
              $events | Select-Object TimeCreated, ProviderName, Id, Message | Format-List | Out-String -Width 240 | Write-Host
            } catch {
              Write-Host ("Could not read crash events: " + $_.Exception.Message)
            }
          }
          if (-not (Test-Path $log) -or -not (Select-String -Path $log -SimpleMatch 'App Started' -Quiet)) {
            $failures += "the log never recorded 'App Started'"
          }
          if ((Test-Path $log) -and (Select-String -Path $log -SimpleMatch 'Unhandled dispatcher exception' -Quiet)) {
            $failures += "an unhandled dispatcher exception was logged (see above)"
          }
          # By process id only: a name-based kill would take the desktop's own Focus Bear with it.
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force; $app.WaitForExit(10000) | Out-Null }
          if ($env:SELF_HOSTED -eq 'true') {
            foreach ($p in $dataDir, $regKey) { if (Test-Path $p) { Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue } }
          }

          if ($failures.Count -gt 0) { $failures | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "Focus Bear started and stayed up for 45s with no unhandled exception."
